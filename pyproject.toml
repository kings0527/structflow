[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "structflow"
version = "0.2.0"
description = "Evidence-first structural research skill and deterministic validation toolkit"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "tavily-python>=0.5.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
market-data = [
    "yfinance>=0.2.40",
    "fredapi>=0.5",
    "cot-reports",
    "edgartools",
    "ccxt>=4.0",
]
market-data-cn = [
    "akshare>=1.14",
]

[project.scripts]
structflow = "structflow.main:main"

# Restrict auto-discovery to the package: the repo root also holds
# non-package directories (scans/, agents/, references/, ...) that
# would otherwise break `pip install -e`.
[tool.setuptools.packages.find]
include = ["structflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
