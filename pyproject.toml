[project]
name = "structflow"
version = "0.1.0"
description = "Industry Scanner Agent - Structural Intelligence System"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "tavily-python>=0.5.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
structflow = "structflow.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
